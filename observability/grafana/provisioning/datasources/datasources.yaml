apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "trace_id=([0-9a-fA-F]+)"
          name: TraceID
          url: "$${__value.raw}"

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: 'Loki'
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterBySpanID: false
        filterByTraceID: true
      serviceMap:
        datasourceUid: 'Prometheus'
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: 'Loki'
